name: Public media playback
run-name: Public playback ${{ inputs.room || 'exhibitions' }}
on:
  workflow_dispatch:
    inputs:
      room:
        description: Published room UUID with audio and video (empty for inaugural exhibitions)
        required: false
        type: string
permissions:
  contents: read
jobs:
  visitor:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: node scripts/public-playback.mjs
        env:
          GALLERY_ROOM: ${{ inputs.room }}
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Android 15 with stock Chrome
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/gallery-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'tail -30 "$RUNNER_TEMP/gallery-emulator.log" 2>/dev/null || true' ERR
          system='system-images;android-35;google_apis_playstore;x86_64'
          "$tools/sdkmanager" --install platform-tools emulator "$system" > /dev/null
          echo no | "$tools/avdmanager" create avd -n gallery -k "$system" --device pixel_7 --path "$ANDROID_AVD_HOME/gallery.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx gallery
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          adb start-server
          "$ANDROID_HOME/emulator/emulator" @gallery -no-window -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/gallery-emulator.log" 2>&1 &
          emulator_pid=$!
          sleep 4
          kill -0 "$emulator_pid"
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell wm dismiss-keyguard
          adb shell pm path com.android.chrome | grep -q package:
          adb shell am set-debug-app --persistent com.android.chrome
          adb shell 'echo "chrome --no-first-run --disable-fre" > /data/local/tmp/chrome-command-line'
          adb shell am start -a android.intent.action.VIEW -d about:blank -n com.android.chrome/com.google.android.apps.chrome.Main
          adb forward tcp:9222 localabstract:chrome_devtools_remote
          curl -fsS --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:9222/json/version
      - run: node scripts/public-playback.mjs --android
        env:
          GALLERY_ROOM: ${{ inputs.room }}
